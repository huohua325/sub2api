name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-compose-gateway-env-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check Docker Compose simple mode environment
        run: /bin/sh deploy/tests/docker-compose-simple-mode-env-test.sh
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.3'
      - name: Unit tests
        working-directory: backend
        run: make test-unit
      - name: Integration tests
        working-directory: backend
        run: make test-integration

  quota-persistence:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: quota_ci
          POSTGRES_PASSWORD: quota_ci_only
          POSTGRES_DB: quota_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quota_ci -d quota_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SUB2API_QUOTA_TEST_DSN: host=127.0.0.1 port=5432 user=quota_ci password=quota_ci_only dbname=quota_ci sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify quota rules survive upgrades and restarts
        working-directory: backend
        run: |
          test -n "$SUB2API_QUOTA_TEST_DSN"
          go test -p 2 -race ./internal/repository -run '^TestCodingQuotaDB' -count=1

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck and critical vitest
        run: make test-frontend

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.3'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=30m
          working-directory: backend

  release-helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/release-tools/requirements-release.txt
      - run: python -m unittest discover -s .github/release-tools -p 'test_release_matrix.py'
      - run: bash -n .github/release-tools/release-images.sh
